<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🎃 SYSTEM_OVERRIDE: HALLOWEEN 🎃</title>
    <style>
        body { 
            background-color: #0b0500; 
            color: #ff6600; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin-top: 50px;
            overflow-x: hidden;
        }
        .terminal {
            border: 2px solid #ff6600;
            display: inline-block;
            padding: 30px;
            background-color: #140a02;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
            border-radius: 8px;
            max-width: 600px;
            min-height: 400px;
            position: relative;
        }
        /* Pantalla de introducción del personaje */
        #pantalla-personaje {
            display: block;
        }
        .imagen-misteriosa {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ff3300;
            box-shadow: 0 0 15px #ff3300;
            margin-bottom: 20px;
            /* Pequeña animación para que flote o parpadee */
            animation: flotar 3s ease-in-out infinite; 
        }
        .voz-misteriosa {
            font-size: 24px;
            color: #ff3300;
            margin-bottom: 25px;
            font-weight: bold;
        }
        /* Pantalla del juego (oculta al inicio) */
        #pantalla-juego {
            display: none;
        }
        .enigma-caja {
            font-size: 26px;
            margin: 25px 0;
            background: #000;
            padding: 20px;
            border: 1px dashed #ff6600;
            text-shadow: 0 0 5px #ff6600;
            color: #39ff14; 
        }
        input {
            background-color: #000;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            font-family: inherit;
            width: 160px;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff6600;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }
        button:hover {
            background-color: #ff9933;
            box-shadow: 0 0 15px #ff6600;
            transform: scale(1.05);
        }
        #mensaje {
            margin-top: 25px;
            font-size: 16px;
            line-height: 1.5;
            color: #ffcc00;
        }
        .codigo-secreto {
            color: #00ffff;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 0 0 5px #00ffff;
        }
        a { color: #39ff14; text-decoration: underline; font-weight: bold; }
        
        /* Animación de flotado para la imagen */
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <!-- ─── PANTALLA 1: EL PERSONAJE MISTERIOSO (SIN BOTÓN) ─── -->
        <div id="pantalla-personaje">
            <!-- Imagen del personaje misterioso. Puedes cambiar este enlace por el tuyo -->
            <img class="imagen-misteriosa" src="https://unsplash.com" alt="Personaje Misterioso">
            
            <div class="voz-misteriosa" id="texto-voz">Iniciando transmisión...</div>
            <p style="color: #888;">Cargando protocolos del sistema...</p>
        </div>

        <!-- ─── PANTALLA 2: EL ACERTIJO MATEMÁTICO ─── -->
        <div id="pantalla-juego">
            <h2>🎃 TRUCO O TRATO ARITMÉTICO 🎃</h2>
            <p>Resuelve la ecuación maldita si quieres escapar con la contraseña de la bóveda.</p>
            
            <div class="enigma-caja" id="problema-texto">Generando maleficio...</div>
            
            <input type="number" id="respuestaUsuario" placeholder="??" autocomplete="off"><br>
            <button onclick="validarMatematica()">ENTREGAR RESPUESTA</button>
            
            <div id="mensaje">Estado: Esperando sacrificio numérico...</div>
        </div>
    </div>

    <script>
        let respuestaCorrecta = 0;

        // Secuencia automática al entrar en la página
        window.onload = function() {
            const textoVoz = document.getElementById("texto-voz");
            
            // Paso 1: Cambia el texto a los 1.5 segundos
            setTimeout(() => {
                textoVoz.innerText = '"¿Quieres jugar a un juego?"';
                textoVoz.style.color = '#ff0000'; // Se pone rojo terrorífico
                textoVoz.style.textShadow = '0 0 10px #ff0000';
            }, 1500);

            // Paso 2: Cambia al juego automáticamente a los 4 segundos totales
            setTimeout(() => {
                document.getElementById("pantalla-personaje").style.display = "none";
                document.getElementById("pantalla-juego").style.display = "block";
                generarProblemaMaldito();
            }, 4000);
        };

        function generarProblemaMaldito() {
            const fantasmas = Math.floor(Math.random() * 12) + 4; 
            const calabazas = Math.floor(Math.random() * 9) + 3;  
            
            document.getElementById("problema-texto").innerText = 
                `¿Cuánto es: ${fantasmas} fantasmas ✕ ${calabazas} calabazas?`;
            
            respuestaCorrecta = fantasmas * calabazas;
        }

        function generarCodigoMisterioso(longitud) {
            const caracteres = 'HALLOWEEN2026XYZK4397';
            let codigo = 'SPOOKY-';
            for (let i = 0; i < longitud; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        function validarMatematica() {
            const entrada = parseInt(document.getElementById("respuestaUsuario").value);
            const mensajeDiv = document.getElementById("mensaje");

            if (isNaN(entrada)) {
                alert("Debes ingresar una respuesta numérica.");
                return;
            }

            if (entrada === respuestaCorrecta) {
                const claveAleatoria = generarCodigoMisterioso(6);
                const urlSiguiente = `paginaB.html?code=${claveAleatoria}`;

                mensajeDiv.innerHTML = `
                    <span style="color: #39ff14;">[CONTRATO SELLADO]</span><br><br>
                    Has sobrevivido al acertijo. La clave se ha manifestado.<br>
                    Tu contraseña es: <span class="codigo-secreto">${claveAleatoria}</span><br><br>
                    <a href="${urlSiguiente}">Huir hacia la Bóveda del Premio ──></a>
                `;
                document.getElementById("respuestaUsuario").disabled = true;
            } else {
                mensajeDiv.innerHTML = `
                    <span style="color: #ff3300;">[TRUCO! RESPUESTA INCORRECTA]</span><br>
                    Los espíritus alteran el enigma. Inténtalo de nuevo...
                `;
                setTimeout(() => {
                    document.getElementById("respuestaUsuario").value = "";
                    mensajeDiv.innerText = "Estado: Esperando sacrificio numérico...";
                    generarProblemaMaldito();
                }, 2000);
            }
        }
    </script>

</body>
</html>
