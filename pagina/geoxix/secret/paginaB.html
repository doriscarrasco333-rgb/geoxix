<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BÓVEDA DE LAS ALMAS</title>
    <style>
        body { 
            background-color: #0b0500; 
            color: #ff6600; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin-top: 80px;
        }
        .boveda {
            border: 2px solid #ff6600;
            display: inline-block;
            padding: 40px;
            background-color: #140a02;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.3);
            border-radius: 8px;
        }
        input {
            background: #000;
            color: #ff6600;
            border: 1px solid #ff6600;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            font-family: inherit;
            margin-bottom: 20px;
            width: 280px;
        }
        button {
            background-color: #ff6600;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
        }
        button:hover {
            background-color: #ff9933;
            box-shadow: 0 0 15px #ff6600;
        }
        #premio-oculto {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #39ff14;
            color: #39ff14;
            background: rgba(57, 255, 20, 0.05);
            display: none;
        }
    </style>
</head>
<body>

    <div class="boveda">
        <h2>🔒 EL COFRE DEL SÁBADO NEGRO</h2>
        <p>Introduce las credenciales obtenidas (SPOOKY-XXXXXX) para reclamar tu botín.</p>

        <input type="text" id="inputClave" placeholder="INGRESAR CLAVE DE ESCAPE" autocomplete="off"><br>
        <button onclick="desencriptar()">REVELAR RECOMPENSA</button>

        <div id="premio-oculto">
            <h3>🎁 TRANSMISIÓN: RECOMPENSA EXTRAÍDA</h3>
            <p>Tu código de regalo final es: <strong>DULCE-O-TRUCO-2026</strong></p>
            <p>Has derrotado al espectro informático.</p>
        </div>
    </div>

    <script>
        function obtenerClaveURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('code');
        }

        const claveCorrecta = obtenerClaveURL();

        function desencriptar() {
            const claveIngresada = document.getElementById("inputClave").value.trim().toUpperCase();

            if (!claveCorrecta) {
                alert("[ERROR] No vienes de ninguna partida del juego.");
                return;
            }

            if (claveIngresada === claveCorrecta) {
                document.getElementById("premio-oculto").style.display = "block";
            } else {
                alert("[ACCESO RECHAZADO] La clave ha caducado o es incorrecta.");
            }
        }
    </script>

</body>
</html>
