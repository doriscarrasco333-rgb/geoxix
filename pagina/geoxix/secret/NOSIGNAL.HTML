<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>No Signal</title>
    <style>
        /* Fondo azul y pantalla completa centradora */
        body {
            background-color: #0000FF; 
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace; 
            user-select: none; 
            
        }

        /* Contenedor principal que junta el bloque de texto (izquierda) y la imagen (derecha) */
        .contenedor-central {
            display: flex;
            align-items: center;
            gap: 40px; 
            color: white;
        }

        /* Contenedor para apilar los textos uno arriba del otro */
        .bloque-texto {
            display: flex;
            flex-direction: column; /* Apila el contenido verticalmente */
            align-items: flex-start; /* Alinea los textos a la izquierda */
            gap: 10px; /* Espacio entre el texto chino y el inglés */
        }

        /* Estilo base para los textos con animación de parpadeo */
        .texto-senal {
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 3px 3px #00008B;
            animation: parpadeo 1.5s infinite; 
        }

        /* Tamaño específico para el texto en chino */
        .chino {
            font-size: 54px; /* Un poco más pequeño para que se equilibre visualmente */
            font-family: 'SimSun', 'STSong', sans-serif; /* Fuentes comunes para caracteres chinos */
        }

        /* Tamaño específico para el texto en inglés */
        .ingles {
            font-size: 64px;
        }

        /* Animación que hace aparecer y desaparecer el texto */
        @keyframes parpadeo {
            0%, 49% { opacity: 1; }
            50%, 55% { opacity: 0; }
            56%, 90% { opacity: 1; }
            91%, 94% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        /* Estilo para la imagen del personaje */
        .imagen-personaje {
            width: 200px; 
            height: auto; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <div class="contenedor-central">
        <!-- Bloque de textos alineados verticalmente -->
        <div class="bloque-texto">
            <!-- Texto en chino arriba (无信号 significa Sin Señal) -->
            <div class="texto-senal chino">无信号</div>
            <!-- Texto en inglés abajo -->
            <div class="texto-senal ingles">NO SIGNAL</div>
        </div>
        
        <!-- Imagen del personaje (Reemplaza 'tu-personaje.png' por la ruta de tu imagen) -->
        <img class="imagen-personaje" src="tu-personaje.png" alt="Personaje">
    </div>

    <script>
        let contadorClics = 0;

        // Escucha los clics en toda la pantalla
        document.body.addEventListener('click', () => {
            contadorClics++;

            if (contadorClics === 3) {
                // Reemplaza con la web a la que quieres redirigir
                window.location.href = "CODIFICING.html"; 
            }
        });
    </script>

</body>
</html>
