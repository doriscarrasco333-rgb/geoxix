<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOXIX</title>
    <!-- Línea añadida para el icono de la pestaña -->
    <link rel="icon" type="image/x-icon" href="Logo.ICO">
    
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin: 0;
            padding-top: 50px; 
            
            background-color: #000000; 
            background-image: url("FondoFrutigerAero.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .nav-container {
            margin: 20px;
            display: flex; /* Alinea los botones uno al lado del otro */
            gap: 20px;     /* Espacio entre los botones */
        }

        /* Estilos generales para todos los botones con imagen */
        .btn-imagen {
            width: 150px;         /* Ancho del botón */
            height: 60px;         /* Alto del botón */
            font-size: 16px;
            font-weight: bold;    /* Hace el texto más legible sobre la imagen */
            cursor: pointer;
            color: white;
            border: 2px solid white; /* Borde blanco para resaltar */
            border-radius: 8px;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8); /* Sombra al texto para que se lea bien */
            transition: transform 0.2s, filter 0.2s;    /* Animación suave */
        }

        /* Imagen específica para el botón de Productos */
        .btn-productos {
            background-image: linear-gradient(rgba(0,9,8,0.0), rgba(0,10,0,0.0)), url("botton-frutiger.png");
        }

        /* Imagen específica para el botón de Juegos */
        .btn-juegos {
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("imagen-juegos.png");
        }

        /* Imagen o color para el botón de Login */
        .btn-login {
            background-image: linear-gradient(rgba(0,123,255,0.6), rgba(0,123,255,0.6)), url("botton-frutiger.png");
        }

        /* Efecto visual al pasar el cursor */
        .btn-imagen:hover {
            transform: scale(1.05); /* Agranda el botón ligeramente */
            filter: brightness(1.2); /* Lo aclara un poco */
        }

        img {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255,255,255,0.2);
        }

        .logo {
            width: 100px; 
            height: auto; 
        }

        /* Ventana modal del inicio de sesión */
        .modal-background {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Fondo oscuro semitransparente */
            backdrop-filter: blur(5px); /* Efecto borroso moderno */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input::placeholder {
            color: #ddd;
        }

        .btn-enviar {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: 1px solid white;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-enviar:hover {
            background: #0056b3;
        }

        .btn-cerrar {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Separador visual */
        .or-separator {
            margin: 20px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .or-separator::before, .or-separator::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        /* Botón de Google Estilo Frutiger */
        .btn-google {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 6px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        .btn-google img {
            width: 18px;
            height: 18px;
            box-shadow: none;
            border-radius: 0;
        }
    </style>
</head>
